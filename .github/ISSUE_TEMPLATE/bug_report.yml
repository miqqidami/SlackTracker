name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.2, MacBook Pro 16" 2019 (Touch Bar)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Last lines of `~/.slacktracker/out.log` and `~/.slacktracker/err.log`.
      render: text
