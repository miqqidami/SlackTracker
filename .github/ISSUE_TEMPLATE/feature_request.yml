name: Feature request
description: Suggest an idea for SlackTracker
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the workflow or problem, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could SlackTracker help?
